name: Agentes de la guarida

on:
  # Cada día hábil a las 22:30 UTC (después del cierre de Wall Street)
  schedule:
    - cron: '30 22 * * 1-5'
  # Botón "Run workflow" en GitHub (también desde la app del celular)
  workflow_dispatch:
    inputs:
      reiniciar:
        description: 'Borrar el portafolio y empezar de cero'
        type: boolean
        default: false
  # Cuando cambias código o configuración
  push:
    branches: [main]
    paths: ['agents/**', 'docs/**', 'config.json', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agentes
  cancel-in-progress: false

jobs:
  agentes:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pruebas del motor
        run: npm test

      - name: Despertar a los agentes
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: |
          if [ "${{ inputs.reiniciar }}" = "true" ]; then
            node agents/run.js --reset
          else
            node agents/run.js
          fi

      - name: Guardar informes en el repositorio
        run: |
          git config user.name "agentes-guarida[bot]"
          git config user.email "agentes-guarida@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Informe de los agentes $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
