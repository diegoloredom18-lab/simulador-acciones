name: Agentes de la guarida

on:
  # Cada día hábil a las 22:30 UTC (después del cierre de Wall Street)
  schedule:
    - cron: '30 22 * * 1-5'
  # Botón "Run workflow" en GitHub (también desde la app del celular)
  workflow_dispatch:
    inputs:
      reiniciar:
        description: 'Borrar el portafolio y empezar de cero'
        type: boolean
        default: false
  # Cuando cambias código o configuración
  push:
    branches: [main]
    paths: ['agents/**', 'docs/**', 'config.json', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: agentes
  cancel-in-progress: false

jobs:
  agentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Pruebas del motor
        run: npm test

      - name: Despertar a los agentes
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: |
          if [ "${{ inputs.reiniciar }}" = "true" ]; then
            node agents/run.js --reset
          else
            node agents/run.js
          fi

      - name: Guardar informes en el repositorio
        run: |
          git config user.name "agentes-guarida[bot]"
          git config user.email "agentes-guarida@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Informe de los agentes $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

      # Publica la carpeta docs/ en la rama gh-pages (GitHub Pages la sirve desde ahí)
      - name: Publicar la guarida en la rama gh-pages
        run: |
          cp -r docs /tmp/sitio && touch /tmp/sitio/.nojekyll
          cd /tmp/sitio
          git init -q -b gh-pages
          git add -A
          git -c user.name="agentes-guarida[bot]" -c user.email="agentes-guarida@users.noreply.github.com" commit -qm "Publicar la guarida"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
